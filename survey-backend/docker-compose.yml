services:
  db:
    image: mysql:8.0
    container_name: survey-mysql
    env_file: .env
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: survey-app
    depends_on:
      db:
        condition: service_healthy
    env_file: .env        # load app + DB env from .env
    ports:
      - "${APP_PORT}:${APP_PORT}"

volumes:
  db_data:
